apiVersion: v1
kind: ConfigMap
metadata:
  name: databasus-nginx
  namespace: databasus
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        server_name databasus.jacobagtyler.com;
        location / {
            return 308 https://databasus.jacobagtyler.com$request_uri;
        }
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name databasus.jacobagtyler.com;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 0;
        location / {
            proxy_pass http://databasus-service:4005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
  start.sh: |
    #!/bin/sh
    set -eu
    fingerprint() { sha256sum /etc/nginx/tls/tls.crt /etc/nginx/tls/tls.key /etc/nginx/conf.d/default.conf; }
    previous=$(fingerprint)
    nginx -t
    nginx
    trap 'nginx -s quit; exit 0' TERM INT
    while kill -0 "$(cat /var/run/nginx.pid)" 2>/dev/null; do
        sleep 30 &
        wait $!
        current=$(fingerprint)
        if [ "$current" != "$previous" ]; then
            if nginx -t && nginx -s reload; then
                previous=$current
            fi
        fi
    done
    exit 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databasus-web
  namespace: databasus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: databasus-web
  template:
    metadata:
      labels:
        app: databasus-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          command: ["/bin/sh", "/opt/nginx/start.sh"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v1/system/health
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: scripts
              mountPath: /opt/nginx
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: databasus-nginx
            items:
              - key: default.conf
                path: default.conf
        - name: scripts
          configMap:
            name: databasus-nginx
            items:
              - key: start.sh
                path: start.sh
        - name: tls
          secret:
            secretName: databasus-tls
---
apiVersion: v1
kind: Service
metadata:
  name: databasus-web
  namespace: databasus
  annotations:
    metallb.io/loadBalancerIPs: 10.3.0.102
spec:
  type: LoadBalancer
  selector:
    app: databasus-web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
