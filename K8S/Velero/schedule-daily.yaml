apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-cluster
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - '*'
    excludedNamespaces:
      - velero
    includeClusterResources: true
    storageLocation: default
    snapshotVolumes: false
    ttl: 168h0m0s
