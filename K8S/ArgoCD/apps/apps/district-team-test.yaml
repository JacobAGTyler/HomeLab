apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: district-team-test
  namespace: argocd
spec:
  project: lbd-apps
  source:
    repoURL: https://github.com/LBDistrictScouts/DistrictTeam.git
    targetRevision: main
    path: K8S/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: district-team-test
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
