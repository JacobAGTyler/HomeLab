apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databasus
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: ghcr.io/databasus/charts
      chart: databasus
      targetRevision: 3.21.0
      helm:
        values: |
          service:
            type: ClusterIP
          persistence:
            storageClassName: truenas-fast-rwx
            accessMode: ReadWriteMany
            size: 10Gi
    - repoURL: https://github.com/JacobAGTyler/HomeLab.git
      targetRevision: main
      path: K8S/Databasus
  destination:
    server: https://kubernetes.default.svc
    namespace: databasus
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: databasus
      namespace: databasus
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
