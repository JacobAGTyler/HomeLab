apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-local-db-ssd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JacobAGTyler/HomeLab.git
    targetRevision: HEAD
    path: K8S/Storage/Local-DB-SSD
  destination:
    server: https://kubernetes.default.svc
    namespace: local-db-ssd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
