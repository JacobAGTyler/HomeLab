apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: event-booking-backend-tls
  namespace: event-booking
spec:
  secretName: event-booking-backend-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - event-backend.jacobagtyler.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-booking-nginx
  namespace: event-booking
data:
  default.conf: |
    server {
        listen 80;
        server_name event-backend.jacobagtyler.com;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name event-backend.jacobagtyler.com;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        root /var/www/html/webroot;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-booking
  namespace: event-booking
spec:
  template:
    spec:
      containers:
        - name: web
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: event-booking-tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: app-code
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: event-booking-nginx
        - name: event-booking-tls
          secret:
            secretName: event-booking-backend-tls
---
apiVersion: v1
kind: Service
metadata:
  name: event-booking-web
  namespace: event-booking
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
