apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: homebox
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
    spec:
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:latest
          env:
            - name: HBOX_LOG_FORMAT
              value: text
            - name: HBOX_LOG_LEVEL
              value: info
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            - name: HBOX_WEB_MAX_UPLOAD
              value: "10"
          ports:
            - name: http
              containerPort: 7745
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - mountPath: /data
              name: homebox-data
      restartPolicy: Always
      volumes:
        - name: homebox-data
          persistentVolumeClaim:
            claimName: homebox-data
