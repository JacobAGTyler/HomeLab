apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: homebox
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.homelab/db-ssd
                    operator: In
                    values:
                      - "true"
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:latest
          env:
            - name: HBOX_LOG_FORMAT
              value: text
            - name: HBOX_LOG_LEVEL
              value: warning
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            - name: HBOX_WEB_MAX_UPLOAD
              value: "10"
          ports:
            - name: http
              containerPort: 7745
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - mountPath: /data
              name: homebox-data
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: web-http
              containerPort: 8080
              protocol: TCP
            - name: web-https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: web-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: web-http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: homebox-tls
              mountPath: /etc/nginx/tls
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: homebox-data
          persistentVolumeClaim:
            claimName: homebox-data
        - name: nginx-config
          configMap:
            name: homebox-nginx
        - name: homebox-tls
          secret:
            secretName: homebox-tls
