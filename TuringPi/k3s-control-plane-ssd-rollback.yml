---
- name: Roll back one control-plane node from SSD-backed k3s data-dir
  hosts: all
  become: true
  gather_facts: false
  serial: 1

  vars:
    k3s_config_dropin_dir: /etc/rancher/k3s/config.yaml.d
    k3s_data_dir_dropin: "{{ k3s_config_dropin_dir }}/data-dir-config.yaml"

  tasks:
    - name: Stop k3s
      service:
        name: k3s
        state: stopped

    - name: Remove the SSD data-dir override
      file:
        path: "{{ k3s_data_dir_dropin }}"
        state: absent

    - name: Start k3s
      service:
        name: k3s
        state: started

    - name: Wait for the local k3s API to report ready
      command: k3s kubectl get --raw=/readyz
      register: readyz_result
      retries: 30
      delay: 5
      until: readyz_result.stdout is search("ok")
      changed_when: false
